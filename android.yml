name: Build Soul AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android project structure
        run: |
          set -eu
          test -f settings.gradle.kts || { echo 'Missing settings.gradle.kts in repository root'; exit 1; }
          test -f build.gradle.kts || { echo 'Missing root build.gradle.kts'; exit 1; }
          test -f app/build.gradle.kts || { echo 'Missing app/build.gradle.kts. Upload the extracted project preserving folders.'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'Missing app/src/main/AndroidManifest.xml'; exit 1; }
          test -f app/src/main/java/com/soulai/player/MainActivity.kt || { echo 'Missing MainActivity.kt in its package folder'; exit 1; }

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
