name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair uploaded file layout
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/soulai/player app/src/main/res/values
          if [ ! -f app/build.gradle.kts ] && [ -f app_build.gradle.kts ]; then cp app_build.gradle.kts app/build.gradle.kts; fi
          if [ ! -f app/src/main/AndroidManifest.xml ] && [ -f AndroidManifest.xml ]; then cp AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ ! -f app/src/main/java/com/soulai/player/MainActivity.kt ] && [ -f MainActivity.kt ]; then cp MainActivity.kt app/src/main/java/com/soulai/player/MainActivity.kt; fi
          if [ ! -f app/src/main/res/values/styles.xml ]; then style_file="$(find . -maxdepth 1 -type f -iname 'styles*' -print -quit || true)"; if [ -n "$style_file" ]; then cp "$style_file" app/src/main/res/values/styles.xml; fi; fi
          if [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle.kts <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SoulAI"
          include(":app")
          GRADLE
          fi
          test -f build.gradle.kts || { echo 'ERROR: root build.gradle.kts missing'; exit 1; }
          test -f app/build.gradle.kts || { echo 'ERROR: app build file missing'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'ERROR: AndroidManifest.xml missing'; exit 1; }
          test -f app/src/main/java/com/soulai/player/MainActivity.kt || { echo 'ERROR: MainActivity.kt missing'; exit 1; }
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soul-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
