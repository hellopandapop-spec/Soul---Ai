name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Expected Directory Structure
        run: |
          mkdir -p /home/runner/work/Soul---Ai/Soul---Ai
          cp -r ${{ github.workspace }}/* /home/runner/work/Soul---Ai/Soul---Ai/ 2>/dev/null || true

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug
        working-directory: /home/runner/work/Soul---Ai/Soul---Ai

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "/home/runner/work/Soul---Ai/Soul---Ai/app/build/outputs/apk/debug/*.apk"
          
