name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Move to Clean Directory and Build
        run: |
          mkdir -p /home/runner/work/clean-build/app
          cp -r * /home/runner/work/clean-build/ 2>/dev/null || true
          cd /home/runner/work/clean-build
          sed -i 's/rootProject.name = .*/rootProject.name = "clean-build"/' settings.gradle.kts || true
          gradle :app:assembleDebug --no-daemon

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /home/runner/work/clean-build/app/build/outputs/apk/debug/*.apk
